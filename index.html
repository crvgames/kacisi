 
 <!DOCTYPE html>
<html lang="tr">
<head>
 <link rel="icon" href="favicon0.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapınak Kaçışı</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: #0b0b0e; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        #game-wrapper {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center; background: #111;
        }
        canvas { display: block; box-shadow: 0 0 50px rgba(0,0,0,0.95); }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 12, 18, 0.95); display: flex;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .hidden { display: none !important; }
        h1 { font-size: 48px; margin-bottom: 5px; color: #f39c12; text-shadow: 0 4px 15px rgba(243,156,18,0.5); text-align: center; }
        p { color: #ccc; margin-bottom: 25px; font-size: 16px; text-align: center; line-height: 1.6; max-width: 600px; }
        .btn {
            background-color: #d35400; color: white; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 20px rgba(211,84,0,0.4); transition: all 0.2s; margin: 8px; min-width: 240px;
        }
        .btn:hover { background-color: #e67e22; transform: scale(1.05); }
        .btn-secondary { background-color: #34495e; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        .btn-secondary:hover { background-color: #2c3e50; }

        #hud {
            position: absolute; top: 20px; left: 20px; right: 160px;
            display: flex; justify-content: flex-start; align-items: center; gap: 15px;
            font-size: 18px; font-weight: bold; pointer-events: none; z-index: 50;
        }
        .hud-box { background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 10px; border: 1px solid #444; backdrop-filter: blur(4px); }

        #pause-btn {
            position: absolute; top: 20px; right: 20px; z-index: 60;
            background-color: #2c3e50; color: #fff; border: 2px solid #4f6d7a; padding: 10px 22px;
            font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: all 0.2s; pointer-events: auto;
        }
        #pause-btn:hover { background-color: #34495e; transform: scale(1.05); }

        /* EKRAN KONTROL TUŞLARI (MOBİL / DOKUNMATİK DESTEĞİ) */
        #touch-controls {
            position: absolute; bottom: 20px; width: 100%; display: flex;
            justify-content: space-between; padding: 0 30px; z-index: 70; pointer-events: none;
        }
        .control-group { display: flex; gap: 12px; pointer-events: auto; }
        .t-btn {
            background: rgba(44, 62, 80, 0.8); border: 2px solid rgba(255,255,255,0.3);
            color: white; font-size: 20px; font-weight: bold; width: 65px; height: 65px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: background 0.1s;
        }
        .t-btn:active { background: rgba(211, 84, 0, 0.9); transform: scale(0.95); }

        #pause-screen, #game-over-screen {
            background: rgba(10, 10, 15, 0.92);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 90;
        }
    </style>
</head>
<body>
<div id="game-wrapper">
    <button id="pause-btn" class="hidden" onclick="togglePause()">DURAKLAT [ESC]</button>

    <div id="hud" class="hidden">
        <div class="hud-box" style="color: #f1c40f;">ALTIN: <span id="coin-hud">0</span></div>
        <div class="hud-box" style="color: #3498db;">SKOR: <span id="score-hud">0</span></div>
        <div class="hud-box" style="color: #e67e22;">EN YÜKSEK: <span id="high-score-hud">0</span></div>
    </div>

    <!-- EKRAN KONTROL BUTONLARI -->
    <div id="touch-controls" class="hidden">
        <div class="control-group">
            <button class="t-btn" onclick="movePlayer('left')">◀</button>
            <button class="t-btn" onclick="movePlayer('right')">▶</button>
        </div>
        <div class="control-group">
            <button class="t-btn" onclick="movePlayer('slide')" style="background: rgba(192, 57, 43, 0.8);">▼</button>
            <button class="t-btn" onclick="movePlayer('jump')" style="background: rgba(39, 174, 96, 0.8);">▲</button>
        </div>
    </div>

    <!-- ANA MENÜ -->
    <div id="main-menu" class="screen">
        <h1>TAPINAK KAÇIŞI</h1>
        <p>
            Virajlı yollar, eğilip geçilen kemerler ve aksiyon dolu müzik eşliğinde kaçış!<br>
            <b>Kontroller:</b> [SOL/SAĞ] Şerit / Viraj Dönüşü | [YUKARI] Zıpla | [AŞAĞI] Eğil<br>
            [ESC] Duraklat
        </p>
        <button class="btn" onclick="startGame()">MACERAYA BAŞLA</button>
    </div>

    <!-- DURAKLATMA EKRANI -->
    <div id="pause-screen" class="hidden">
        <h1>OYUN DURAKLATILDI</h1>
        <p>Soluklanma molası, kaldığın yerden devam et.</p>
        <button class="btn" onclick="togglePause()">DEVAM ET</button>
        <button class="btn btn-secondary" onclick="returnToMenu()">ANA MENÜYE DÖN</button>
    </div>

    <!-- OYUN BİTTİ EKRANI -->
    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #e74c3c;">ÇARPTIN!</h1>
        <p id="final-stats-text" style="font-size: 18px; margin-bottom: 20px;"></p>
        <button class="btn" onclick="startGame()">TEKRAR DENE</button>
        <button class="btn btn-secondary" onclick="returnToMenu()">ANA MENÜ</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let canvasWidth = window.innerWidth;
    let canvasHeight = window.innerHeight;
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    window.addEventListener('resize', () => {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
    });

    // Ses ve Arka Plan Müziği (Web Audio API)
    let audioCtx = null;
    let musicInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(700, now);
            osc.frequency.exponentialRampToValueAtTime(1400, now + 0.15);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'jump') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(450, now + 0.2);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
            gainNode.gain.setValueAtTime(0.35, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'turn') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now); osc.stop(now + 0.25);
        }
    }

    // Arka Plan Aksiyon Müziği Döngüsü
    let musicNotes = [130.81, 164.81, 196.00, 220.00, 261.63, 329.63];
    let noteIndex = 0;
    function startBackgroundMusic() {
        if (musicInterval) clearInterval(musicInterval);
        musicInterval = setInterval(() => {
            if (gameState !== 'PLAYING' || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(musicNotes[noteIndex % musicNotes.length], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
                noteIndex++;
            } catch(e) {}
        }, 220);
    }

    function stopBackgroundMusic() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }

    let gameState = 'MENU';
    let score = 0;
    let coins = 0;
    let highScore = localStorage.getItem('temple_ult_high') ? parseInt(localStorage.getItem('temple_ult_high')) : 0;
    document.getElementById('high-score-hud').textContent = highScore;

    let gameSpeed = 9;
    let distanceTraveled = 0;
    let animTimer = 0;

    // Yol Eğriliği ve Kamera Yönetimi
    let roadCurve = 0;
    let targetCurve = 0;
    let curveTimer = 0;

    let player = {
        lane: 0,
        currentXOffset: 0,
        y: 0,
        z: 0,
        isJumping: false,
        jumpVelocity: 0,
        isSliding: false,
        slideTimer: 0
    };

    let obstacles = [];
    let collectibleCoins = [];
    let spawnTimer = 0;

    function movePlayer(action) {
        if (gameState !== 'PLAYING') return;
        if (action === 'left') {
            if (player.lane > -1) player.lane--;
        } else if (action === 'right') {
            if (player.lane < 1) player.lane++;
        } else if (action === 'jump') {
            if (!player.isJumping && !player.isSliding) {
                player.isJumping = true;
                player.jumpVelocity = -15;
                playSound('jump');
            }
        } else if (action === 'slide') {
            if (!player.isJumping && !player.isSliding) {
                player.isSliding = true;
                player.slideTimer = 45;
            }
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (gameState === 'PLAYING' || gameState === 'PAUSED') togglePause();
            return;
        }
        if (gameState !== 'PLAYING') return;

        if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer('left');
        else if (e.key === 'ArrowRight' || e.key === 'd') movePlayer('right');
        else if (e.key === 'ArrowUp' || e.key === 'w') movePlayer('jump');
        else if (e.key === 'ArrowDown' || e.key === 's') movePlayer('slide');
    });

    function startGame() {
        initAudio();
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('pause-screen').classList.add('hidden');
        document.getElementById('pause-btn').classList.remove('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('touch-controls').classList.remove('hidden');

        score = 0;
        coins = 0;
        gameSpeed = 9;
        distanceTraveled = 0;
        obstacles = [];
        collectibleCoins = [];
        spawnTimer = 0;
        roadCurve = 0;
        targetCurve = 0;
        curveTimer = 0;
        player.lane = 0;
        player.isJumping = false;
        player.isSliding = false;

        document.getElementById('coin-hud').textContent = coins;
        document.getElementById('score-hud').textContent = score;
        document.getElementById('high-score-hud').textContent = highScore;

        gameState = 'PLAYING';
        startBackgroundMusic();
    }

    function togglePause() {
        if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            document.getElementById('pause-screen').classList.remove('hidden');
        } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            document.getElementById('pause-screen').classList.add('hidden');
        }
    }

    function returnToMenu() {
        gameState = 'MENU';
        stopBackgroundMusic();
        document.getElementById('pause-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('pause-btn').classList.add('hidden');
        document.getElementById('touch-controls').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        stopBackgroundMusic();
        playSound('crash');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('pause-btn').classList.add('hidden');
        document.getElementById('touch-controls').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('temple_ult_high', highScore);
            document.getElementById('high-score-hud').textContent = highScore;
        }

        document.getElementById('final-stats-text').innerHTML = 
            `Toplanan Altın: <b>${coins}</b><br>Kazanılan Skor: <b>${score}</b><br>En Yüksek Skor: <b>${highScore}</b>`;
    }

    function spawnEntities() {
        spawnTimer++;
        if (spawnTimer > Math.max(28, 80 - Math.floor(score / 350))) {
            spawnTimer = 0;
            let lane = Math.floor(Math.random() * 3) - 1;
            let typeRand = Math.random();

            if (typeRand < 0.35) {
                // Yerde engel
                obstacles.push({ lane: lane, z: 1000, type: 'barrier', width: 95, height: 85 });
            } else if (typeRand < 0.65) {
                // Altı boş, üstü dolu kemer (Eğilerek geçilir)
                obstacles.push({ lane: lane, z: 1000, type: 'arch', width: 100, height: 110 });
            } else {
                // Altınlar
                for (let i = 0; i < 3; i++) {
                    collectibleCoins.push({ lane: lane, z: 1000 + (i * 45) });
                }
            }
        }
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        distanceTraveled += gameSpeed;
        score = Math.floor(distanceTraveled / 10) + (coins * 15);
        document.getElementById('score-hud').textContent = score;
        document.getElementById('coin-hud').textContent = coins;

        gameSpeed = 9.5 + Math.floor(score / 450);
        animTimer += gameSpeed * 0.15;

        // Viraj ve Yol Dönüş Mekaniği
        curveTimer++;
        if (curveTimer > 180) {
            curveTimer = 0;
            targetCurve = (Math.random() - 0.5) * 1.8; // Sağa veya sola dönüş
            if (Math.abs(targetCurve) > 0.4) playSound('turn');
        }
        roadCurve += (targetCurve - roadCurve) * 0.03;

        let targetX = player.lane * 130;
        player.currentXOffset += (targetX - player.currentXOffset) * 0.25;

        if (player.isJumping) {
            player.y += player.jumpVelocity;
            player.jumpVelocity += 0.85;
            if (player.y >= 0) { player.y = 0; player.isJumping = false; }
        }

        if (player.isSliding) {
            player.slideTimer--;
            if (player.slideTimer <= 0) player.isSliding = false;
        }

        spawnEntities();

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.z -= gameSpeed;

            if (obs.z > 20 && obs.z < 90 && obs.lane === player.lane) {
                if (obs.type === 'barrier') {
                    gameOver();
                } else if (obs.type === 'arch') {
                    // Üstü dolu, altı boş: Sadece eğilerek geçilebilir!
                    if (!player.isSliding) {
                        gameOver();
                    }
                }
            }
            if (obs.z < 0) obstacles.splice(i, 1);
        }

        for (let i = collectibleCoins.length - 1; i >= 0; i--) {
            let c = collectibleCoins[i];
            c.z -= gameSpeed;

            if (c.z > 20 && c.z < 90 && c.lane === player.lane) {
                coins++;
                playSound('coin');
                collectibleCoins.splice(i, 1);
                continue;
            }
            if (c.z < 0) collectibleCoins.splice(i, 1);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // Arka Plan / Gökyüzü
        let bgGrad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
        bgGrad.addColorStop(0, '#07070d');
        bgGrad.addColorStop(0.4, '#191124');
        bgGrad.addColorStop(1, '#050508');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        const centerX = canvasWidth / 2 + (roadCurve * 150);
        const horizonY = canvasHeight * 0.36;
        const roadBottomY = canvasHeight;

        // Antik Duvarlar (Viraj Efektli)
        ctx.fillStyle = '#17110d';
        ctx.beginPath();
        ctx.moveTo(centerX - 280, horizonY);
        ctx.lineTo(-120 + roadCurve * 250, roadBottomY);
        ctx.lineTo(0, roadBottomY);
        ctx.lineTo(centerX - 140, horizonY);
        ctx.fill();

        ctx.fillStyle = '#1f1610';
        ctx.beginPath();
        ctx.moveTo(centerX + 280, horizonY);
        ctx.lineTo(canvasWidth + 120 + roadCurve * 250, roadBottomY);
        ctx.lineTo(canvasWidth, roadBottomY);
        ctx.lineTo(centerX + 140, horizonY);
        ctx.fill();

        // Taş Yol
        ctx.fillStyle = '#261d17';
        ctx.beginPath();
        ctx.moveTo(centerX - 240, horizonY);
        ctx.lineTo(centerX + 240, horizonY);
        ctx.lineTo(centerX + 420 + roadCurve * 300, roadBottomY);
        ctx.lineTo(centerX - 420 + roadCurve * 300, roadBottomY);
        ctx.fill();

        // Şerit Çizgileri
        ctx.strokeStyle = '#d35400';
        ctx.lineWidth = 3;
        ctx.setLineDash([25, 30]);
        ctx.lineDashOffset = -distanceTraveled * 0.9;

        for (let l = -1; l <= 1; l++) {
            if (l === 0) continue;
            ctx.beginPath();
            ctx.moveTo(centerX + (l * 80), horizonY);
            ctx.lineTo(centerX + (l * 210) + roadCurve * 150, roadBottomY);
            ctx.stroke();
        }
        ctx.setLineDash([]);

        // Altınları Çiz
        collectibleCoins.forEach(c => {
            let scale = 1000 / (1000 + c.z);
            let curveFactor = roadCurve * (1 - c.z / 1000) * 150;
            let x = centerX + c.lane * 140 * scale + player.currentXOffset * scale * 0.15 + curveFactor;
            let y = horizonY + (roadBottomY - horizonY) * (1 - c.z / 1000);
            let radius = 13 * scale;

            if (radius > 0) {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(x, y - 25, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b7950b';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        // Engelleri Çiz (Yere basan veya kemer yapılar)
        obstacles.forEach(obs => {
            let scale = 1000 / (1000 + obs.z);
            let curveFactor = roadCurve * (1 - obs.z / 1000) * 150;
            let x = centerX + obs.lane * 140 * scale + player.currentXOffset * scale * 0.15 + curveFactor;
            let y = horizonY + (roadBottomY - horizonY) * (1 - obs.z / 1000);
            let w = obs.width * scale;
            let h = obs.height * scale;

            if (w > 0) {
                if (obs.type === 'barrier') {
                    ctx.fillStyle = '#962d22';
                    ctx.fillRect(x - w / 2, y - h, w, h);
                    ctx.strokeStyle = '#f5b041';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x - w / 2, y - h, w, h);
                } else if (obs.type === 'arch') {
                    // Üstü dolu, altı boş kemer tapınak yapısı
                    ctx.fillStyle = '#78281f';
                    // Üst kiriş
                    ctx.fillRect(x - w / 2 - 15, y - h, w + 30, 35);
                    // Sağ ve sol sütunlar (altı boşluk bırakır)
                    ctx.fillRect(x - w / 2 - 10, y - h + 35, 20, h - 35);
                    ctx.fillRect(x + w / 2 - 10, y - h + 35, 20, h - 35);
                    ctx.strokeStyle = '#e74c3c';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x - w / 2 - 15, y - h, w + 30, h);
                }
            }
        });

        // Karakter Çizimi
        let pScreenX = canvasWidth / 2 + player.currentXOffset + (roadCurve * 80);
        let pScreenY = roadBottomY - 150 + player.y;
        
        let legSwing = Math.sin(animTimer) * 20;
        let armSwing = Math.cos(animTimer) * 20;
        if (player.isJumping) { legSwing = 10; armSwing = -15; }
        if (player.isSliding) { legSwing = 0; armSwing = 0; }

        let bodyHeight = player.isSliding ? 40 : 85;
        let bodyWidth = player.isSliding ? 70 : 45;
        let bodyY = player.isSliding ? pScreenY - 45 : pScreenY - bodyHeight;

        // Baş
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.arc(pScreenX, bodyY - 18, 14, 0, Math.PI * 2);
        ctx.fill();

        // Gövde
        ctx.fillStyle = '#2980b9';
        ctx.fillRect(pScreenX - bodyWidth / 2, bodyY, bodyWidth, bodyHeight);

        // Kollar
        ctx.strokeStyle = '#2980b9';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        
        ctx.beginPath();
        ctx.moveTo(pScreenX - bodyWidth / 2, bodyY + 15);
        ctx.lineTo(pScreenX - bodyWidth / 2 - 15, bodyY + 35 + armSwing);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pScreenX + bodyWidth / 2, bodyY + 15);
        ctx.lineTo(pScreenX + bodyWidth / 2 + 15, bodyY + 35 - armSwing);
        ctx.stroke();

        // Bacaklar
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 10;

        ctx.beginPath();
        ctx.moveTo(pScreenX - 10, bodyY + bodyHeight);
        ctx.lineTo(pScreenX - 15 + legSwing, bodyY + bodyHeight + 35);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pScreenX + 10, bodyY + bodyHeight);
        ctx.lineTo(pScreenX + 15 - legSwing, bodyY + bodyHeight + 35);
        ctx.stroke();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
